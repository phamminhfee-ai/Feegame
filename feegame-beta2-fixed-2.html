<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kharon & Marivex – Sinh tồn</title>
<style>

:root[data-theme="dark"]{--bg:#10131d;--fg:#e6e9f4;--mu:#98a1b8;--ch:#1b1f2f;--ln:#2b3046}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:14px "Trebuchet MS",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;gap:8px;padding:8px;-webkit-user-select:none;user-select:none}
.w{width:100%;max-width:560px}
#hud{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.c{background:var(--ch);border:1px solid var(--ln);border-radius:10px;padding:6px 8px;color:var(--mu);font-size:12px}
.c b{display:block;font-size:16px;color:var(--fg)}
#st{position:relative;border-radius:16px;overflow:hidden;background:radial-gradient(ellipse at 50% 30%,#2f3b6e,#161a33 75%)}
#sc{overflow:auto;max-height:70vh}

#al{display:flex;flex-direction:column;gap:4px}#al div{background:#8a2230;color:#fff;border-radius:8px;padding:5px 8px;font-size:12px}
#act{flex-wrap:wrap}#pick{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);display:none;gap:8px;background:var(--ch);border:1px solid var(--ln);border-radius:12px;padding:10px;z-index:5}#pick button{padding:10px 14px;border-radius:10px;border:1px solid var(--ln);background:var(--bg)}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:20px;background:rgba(14,16,36,.86);color:#eef0ff}
#ov h1{margin:0;font-size:24px;color:#ffc857}#ov p{margin:0;max-width:34ch;line-height:1.5;color:#c9cdf0}

.pb{background:#ffc857;color:#2a2147;border:0;border-radius:10px;padding:10px 22px;font-weight:700}

#tools button i{display:block;font-style:normal;font-size:20px}
#tools button.on{border-color:#ffc857;box-shadow:0 0 0 2px #ffc857 inset}

.t{background:var(--ch);border:1px solid var(--ln);border-radius:10px;padding:8px}
.t h3{margin:0 0 4px;font-size:14px}.t small{color:var(--mu)}

.bar span{width:58px}.bar div{position:relative;flex:1;height:7px;border-radius:4px;background:var(--ln)}
.bar div i{position:absolute;left:0;top:0;bottom:0;border-radius:4px}.bar div u{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--fg)}
#act{display:flex;gap:6px}#act button{flex:1;padding:8px;border-radius:10px;border:1px solid var(--ln);background:var(--ch)}
button:focus-visible{outline:3px solid #7aa7ff;outline-offset:2px}

</style></head><body>
<div id="hud" class="w"></div>
<div id="st" class="w"><div id="sc"><canvas id="c"></canvas></div>
<div id="ov"><h1>Kharon & Marivex</h1><p>Lập các khu, chăm sóc hai tộc và giữ lõi qua 45 đợt. Nhấn giữ nút Sinh sống để chọn tộc: Kharon (xám) sống trên đất, Marivex (xanh) sống trên nước. Xây nhà máy trên quặng đồng/chì để sản xuất nhiều hơn. Beta 2 thêm Turret đa năng và Pháo phòng không lớn.</p><button class="pb" id="go">Chơi mới</button><button class="pb" id="ct" style="display:none">Tiếp tục</button></div></div>
<div id="msg" class="w"></div>
<div id="tools" class="w"></div>
<div id="al" class="w"></div><div id="tr" class="w"></div>
<div id="act" class="w"><button id="sv">💾 Lưu</button><button id="sp">Tốc độ ×1</button><button id="sk">⏭ Bỏ qua đợt</button><button id="vz">🌫 Vùng: tắt</button></div><div id="pick"><button data-r="0">Kharon (xám)</button><button data-r="1">Marivex (xanh)</button></div>
<script>
const $=i=>document.getElementById(i),cv=$('c'),ctx=cv.getContext('2d'),N=16,CX=8,CY=8;
const ZN={h:['🏠','#4a78c2'],i:['🏭','#b8862f'],u:['🛠️','#8c5fb0'],t1:['🔫','#a9653b'],t2:['💥','#75624c'],p:['⚡','#c9b52e']};
const SRC={i:[35,30],p:[20,25],t1:[15,8],t2:[20,18],u:[10,8]};
const TOOLS=[['h','🏠','Sinh sống',15],['i','🏭','Công nghiệp',15],['u','🛠️','Xây unit',15],['t1','🔫','Turret đa năng',35],['t2','💥','Pháo phòng không',60],['p','⚡','Điện',15],['m','👥','Điều dân',0],['x','✖','Xóa',0]];
let tw,th,ox,oy,dpr,W,H,tool='h',G,TR,cu,pb,wave,wt,core,E,Q,FX,state='menu',spd=1,tick=0,avgH=0,work=1,boss=0,msg='',tribe=0,ovl=0,NZ=[],PO=[];
const water=(x,y)=>x+y>=24||(x<=1&&y>=8)||Math.hypot(x-12,y-4)<2.2;
const ore=(x,y)=>{if(water(x,y)||Math.hypot(x-CX,y-CY)<2)return 0;const h=(((x>>1)*73856093^(y>>1)*19349663)>>>0)%9;return h===0?1:h===1?2:0};
function size(){const sw=$('st').clientWidth;dpr=Math.min(devicePixelRatio||1,2);tw=Math.max(30,Math.min(sw/N,40));th=tw/2;W=Math.round(N*tw);ox=W/2;oy=tw*.5;H=Math.round(oy+N*th+tw*.3);cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+'px';cv.style.height=H+'px'}
addEventListener('resize',size);size();$('sc').scrollLeft=(W-$('sc').clientWidth)/2;
function init(){G=[];for(let x=0;x<N;x++){G[x]=[];for(let y=0;y<N;y++)G[x][y]={w:water(x,y),z:null,t:1,b:0,cd:0,o:ore(x,y),r:0}}
 TR=[{n:'Kharon',c:'#a7adb5',tN:65,tP:95,r:.05,pop:0,h:0,no:0,po:0,k:0},{n:'Marivex',c:'#3d9be9',tN:20,tP:60,r:.2,pop:0,h:0,no:0,po:0,k:0}];
 cu=450;pb=200;wave=1;wt=0;core=1500;E=[];Q=[];FX=[];boss=0;stats()}
function dur2(w){return w<=10?60:w<=30?45:40}
function stats(){const S={i:0,u:0,t1:0,t2:0,p:0,d:0},src=[];TR.forEach(r=>{r.k=0;r.no=0;r.po=0});
 for(let x=0;x<N;x++)for(let y=0;y<N;y++){const t=G[x][y];if(!t.z)continue;if(t.z==='h')TR[t.r].k++;else{S[t.z]+=t.w?1.5*(t.z==='p'):1;if(SRC[t.z])src.push([x,y,...SRC[t.z]])}}
 for(let x=0;x<N;x++){NZ[x]=[];PO[x]=[];for(let y=0;y<N;y++){const t=G[x][y];let n=0,p=0;for(const s of src){const f=Math.max(0,1-Math.hypot(x-s[0],y-s[1])/4.5);n+=s[2]*f;p+=s[3]*f}n=Math.min(100,n);p=Math.min(100,p*(t.w?1.25:1));NZ[x][y]=n;PO[x][y]=p;if(t.z==='h'){const r=TR[t.r];r.no+=n;r.po+=p}}}
 const P=TR[0].pop+TR[1].pop;const jobs=S.i*4+S.t1*2+S.t2*3+S.p*2+S.u*2;work=P>0?Math.min(1,jobs/P):1;
 TR.forEach(r=>{if(r.k){r.no/=r.k;r.po/=r.k}r.h=r.k?Math.max(0,100-(1-work)*40-Math.min(1,r.no/r.tN)*35-Math.min(1,r.po/r.tP)*35):0});
 avgH=P>0?(TR[0].h*TR[0].pop+TR[1].h*TR[1].pop)/P:0;stats.S=S;stats.jobs=jobs}
function spawn(k,b){const e=Math.floor(Math.random()*N);let x,y;
 if(k==='s'){x=N-1;y=N-1}else if(k==='a'){[x,y]=[[e,-1],[-1,e],[N,e],[e,N]][Math.floor(Math.random()*4)]}else{x=e;y=-1}
 const hp=b?1000:12+wave*2.5;E.push({x,y,hp,mh:hp,k,sp:b?.2:k==='a'?.65:.42,b})}
function startWave(){if(wave<11)return;const n=Math.floor(2+(wave-10)*.7),ks=wave<15?['g']:wave<20?['g','a']:['g','a','s'],iv=(dur2(wave)-6)/n;
 for(let i=0;i<n;i++)Q.push({t:i*iv+1,k:ks[i%ks.length]});if(wave===45)Q.push({t:3,k:'g',b:1})}
function fire(x,y,rg,mn,dmg,sp,air,t){let b=null,bd=1e9;for(const e of E){const d=Math.hypot(e.x-x,e.y-y);if(d<=rg&&d>=mn&&d<bd){b=e;bd=d}}if(!b)return 0;
 if(sp){E.forEach(e=>{if(Math.hypot(e.x-b.x,e.y-b.y)<=1.3)e.hp-=dmg});FX.push({k:'b',x:b.x,y:b.y,t:.35})}
 else{if(!(b.k==='a'&&Math.random()>.55))b.hp-=dmg;FX.push({k:'l',x,y,x2:b.x,y2:b.y,t:.1})}return 1}
function step(dt){if(state!=='play')return;
 wt+=dt;if(wt>=dur2(wave)){wt=0;if(wave<45){wave++;startWave();save(1)}}
 Q.forEach(q=>q.t-=dt);Q=Q.filter(q=>{if(q.t<=0){spawn(q.k,q.b);if(q.b)boss=1;return false}return true});
 tick+=dt;if(tick>=.25){stats();tick=0}
 const P=TR[0].pop+TR[1].pop,S=stats.S,pw=.6+.4*Math.min(1,S.p*3/(S.i+S.d+1)),stf=Math.min(1,P/(stats.jobs+.01)),eff=Math.max(.15,avgH/100)*stf*pw;
 let bc=0,bl=0;for(let x=0;x<N;x++)for(let y=0;y<N;y++){const t=G[x][y];if(t.b>0){t.b-=dt}if(t.z==='i'){const m=t.b>0?1.6:1;bc+=m*(t.o===1?1:.2);bl+=m*(t.o===2?.6:.12)}}
 cu+=bc*eff*dt;pb+=bl*eff*dt;
 TR.forEach((r,i)=>{if(!r.k){r.pop=0;return}if(r.pop===0)r.pop=3;const cap=r.k*6;
  if(r.no>r.tN)r.pop*=1-.02*dt*(1+r.no/r.tN);if(r.po>r.tP)r.pop*=1-.05*dt;if(r.h<30)r.pop*=1-.01*dt;
  else if(r.h>=50&&r.pop<cap)r.pop=Math.min(cap,r.pop+r.r*r.k*dt*r.h/100);if(r.pop<.5&&r.k)r.pop=0});
 for(let x=0;x<N;x++)for(let y=0;y<N;y++){const t=G[x][y];if(!['t1','t2'].includes(t.z))continue;t.cd-=dt*Math.max(.3,eff)*(t.b>0?1.6:1);if(t.cd>0)continue;
  if(t.z==='t1'){
    // Turret đa năng: ưu tiên đạn chì khi có đủ, nếu không dùng đạn đồng.
    if(pb>=1&&fire(x,y,5.2,0,35,0,0,'t1')){pb-=1;t.cd=1.8;t.ammo='lead'}
    else if(cu>=.25&&fire(x,y,5.2,0,10,0,0,'t1')){cu-=.25;t.cd=.45;t.ammo='copper'}
  }else{
    // Pháo phòng không lớn: tầm xa, blast lớn, ưu tiên mục tiêu trên không.
    let target=null,bd=1e9;for(const e of E){const d=Math.hypot(e.x-x,e.y-y);if(d<=8&&d<bd&&e.k==='a'){target=e;bd=d}}
    if(!target)for(const e of E){const d=Math.hypot(e.x-x,e.y-y);if(d<=8&&d<bd){target=e;bd=d}}
    if(target&&pb>=2){E.forEach(e=>{if(Math.hypot(e.x-target.x,e.y-target.y)<=1.3)e.hp-=55});FX.push({k:'b',x:target.x,y:target.y,t:.5});pb-=2;t.cd=3.5;t.ammo='lead'}
  }
}
 if((G.cc=(G.cc||0)-dt)<=0&&fire(CX,CY,3.5,0,9,0)){G.cc=.6}
 for(const e of E){const dx=CX-e.x,dy=CY-e.y,d=Math.hypot(dx,dy);if(d>.6){e.x+=dx/d*e.sp*dt;e.y+=dy/d*e.sp*dt}else core-=(e.b?9:2)*dt}
 const before=E.length;E=E.filter(e=>{if(e.hp<=0){if(e.b){boss=0}return false}return true});
 if(wave>=45&&!boss&&!Q.length&&!E.length&&wt>5)end(1);if(core<=0)end(0);
 FX.forEach(f=>f.t-=dt);FX=FX.filter(f=>f.t>0)}
function end(win){state='over';$('ov').style.display='flex';$('ov').querySelector('h1').textContent=win?'Chiến thắng!':'Lõi đã sụp đổ';$('ov').querySelector('p').textContent=win?'Bạn đã thủ thành và hạ boss ở đợt 45.':'Bạn dừng ở đợt '+wave+'. Thử bố trí thêm Turret đa năng hoặc Pháo phòng không lớn.';$('go').textContent='Chơi lại';$('ct').style.display='none'}
function save(auto){try{const z=[];G.forEach((c,x)=>c.forEach((t,y)=>{if(t.z)z.push([x,y,t.z,t.z==='h'?t.r:t.t])}));
 localStorage.setItem('km-save3',JSON.stringify({z,cu,pb,wave,wt,core,pop:TR.map(r=>r.pop)}));msg=auto?'Đã tự lưu ở đợt '+wave:'Đã lưu tiến trình'}catch(e){msg='Không lưu được trên trình duyệt này'}}
function load(){try{const s=JSON.parse(localStorage.getItem('km-save3'));if(!s)return false;init();s.z.forEach(([x,y,z,t])=>{G[x][y].z=z;if(z==='h')G[x][y].r=t;else G[x][y].t=t});({cu,pb,wave,wt,core}=s);TR.forEach((r,i)=>r.pop=s.pop[i]);stats();return true}catch(e){return false}}
function begin(cont){if(!(cont&&load()))init();state='play';$('ov').style.display='none'}
$('go').onclick=()=>begin(0);$('ct').onclick=()=>begin(1);$('sv').onclick=()=>save(0);
$('sp').onclick=()=>{spd=spd===1?4:1;$('sp').textContent='Tốc độ ×'+spd};
$('sk').onclick=()=>{if(state!=='play')return;if(wave>=45){msg='Đây là đợt cuối, hãy hạ boss để thắng';return}wt=dur2(wave)};
$('vz').onclick=()=>{ovl=(ovl+1)%3;$('vz').textContent=['🌫 Vùng: tắt','🔊 Vùng: tiếng ồn','☁️ Vùng: ô nhiễm'][ovl]};
try{if(localStorage.getItem('km-save3'))$('ct').style.display=''}catch(e){}
TOOLS.forEach(t=>{const b=document.createElement('button');b.innerHTML='<i>'+t[1]+'</i>'+t[2]+(t[0]==='t1'?'<br>35 đồng + 10 chì':t[0]==='t2'?'<br>60 đồng + 25 chì':(t[3]?'<br>'+t[3]+' đồng':''));b.dataset.k=t[0];b.onclick=()=>{tool=t[0];[...$('tools').children].forEach(c=>c.classList.toggle('on',c===b))};if(t[0]==='h'){b.classList.add('on');let lp;b.addEventListener('pointerdown',()=>{lp=setTimeout(()=>{$('pick').style.display='flex'},450)});['pointerup','pointerleave','pointercancel'].forEach(v=>b.addEventListener(v,()=>clearTimeout(lp)));window.hb=b}$('tools').appendChild(b)});
function hbl(){hb.innerHTML='<i>🏠</i>Sinh sống<br>'+['Kharon','Marivex'][tribe]+'<br>15 đồng'}hbl();
document.querySelectorAll('#pick button').forEach(b=>b.onclick=()=>{tribe=+b.dataset.r;tool='h';$('pick').style.display='none';hbl();[...$('tools').children].forEach(c=>c.classList.toggle('on',c===hb))});
function place(x,y){if(state!=='play'||x<0||y<0||x>=N||y>=N||(x===CX&&y===CY))return;const t=G[x][y];
 if(tool==='x'){t.z=null;return}if(tool==='m'){if(['i','t1','t2','p'].includes(t.z)){t.b=20;msg='Đã điều dân đến tăng tốc khu này 20 giây'}return}
 const d=tool;if(t.w&&d!=='h'&&d!=='p'){msg='Chỉ khu sinh sống và khu điện đặt được trên nước';return}if(d==='h'&&(tribe===1)!==t.w){msg=tribe?'Marivex chỉ sống trên nước':'Kharon chỉ sống trên đất';return}
 const c=tool==='t1'?[35,10]:tool==='t2'?[60,25]:[15,0];if(t.z===d&&(d==='h'?t.r===tribe:true))return;if(cu<c[0]||pb<c[1]){msg='Không đủ tài nguyên';return}
 cu-=c[0];pb-=c[1];t.z=d;t.cd=0;t.b=0;t.ammo=d==='t1'?'copper':d==='t2'?'lead':'';if(d==='h')t.r=tribe;stats()}
function at(e){const r=cv.getBoundingClientRect(),px=(e.clientX-r.left)*W/r.width,py=(e.clientY-r.top)*H/r.height,u=(px-ox)/(tw/2),v=(py-oy-th/2)/(th/2);return[Math.round((u+v)/2),Math.round((v-u)/2)]}
let sp0=null;cv.addEventListener('pointerdown',e=>{sp0=[e.clientX,e.clientY]});cv.addEventListener('pointerup',e=>{if(sp0&&Math.hypot(e.clientX-sp0[0],e.clientY-sp0[1])<10)place(...at(e));sp0=null});
const iso=(x,y)=>[ox+(x-y)*tw/2,oy+(x+y)*th/2];
function poly(p,f){ctx.beginPath();p.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.closePath();ctx.fillStyle=f;ctx.fill()}
function draw(){ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);const h=tw/2,v=th,d=tw*.12;
 for(let s=0;s<2*N-1;s++)for(let x=0;x<N;x++){const y=s-x;if(y<0||y>=N)continue;const t=G[x][y],[sx,sy]=iso(x,y);
  poly([[sx-h,sy+v/2],[sx,sy+v],[sx,sy+v+d],[sx-h,sy+v/2+d]],t.w?'#1b4b7a':'#24493f');poly([[sx,sy+v],[sx+h,sy+v/2],[sx+h,sy+v/2+d],[sx,sy+v+d]],t.w?'#225c93':'#2c5c50');
  poly([[sx,sy],[sx+h,sy+v/2],[sx,sy+v],[sx-h,sy+v/2]],t.w?((x+y)%2?'#2f7cc0':'#2a72b3'):((x+y)%2?'#3a7766':'#3f8270'));
  if(t.o&&!t.z){ctx.fillStyle=t.o===1?'#e08a4a':'#c4cde0';[[-.12,0],[.1,-.05],[0,.1]].forEach(q=>{ctx.beginPath();ctx.arc(sx+q[0]*tw,sy+v/2+q[1]*tw,tw*.07,0,7);ctx.fill()})}
  if(ovl){const a=(ovl===1?NZ:PO)[x];if(a&&a[y]>1){ctx.globalAlpha=Math.min(.7,a[y]/100*1.2);poly([[sx,sy],[sx+h,sy+v/2],[sx,sy+v],[sx-h,sy+v/2]],ovl===1?'#b04dff':'#7a8f2a');ctx.globalAlpha=1}}
  if(t.z){ctx.globalAlpha=.7;poly([[sx,sy],[sx+h,sy+v/2],[sx,sy+v],[sx-h,sy+v/2]],t.z==='h'?TR[t.r].c:ZN[t.z][1]);ctx.globalAlpha=1;ctx.font=Math.round(tw*.5)+'px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(ZN[t.z][0],sx,sy+v/2);if(t.b>0){ctx.strokeStyle='#ffc857';ctx.lineWidth=2;ctx.stroke()}}
  if(x===CX&&y===CY){const u=tw*.5;poly([[sx-h,sy+v/2],[sx,sy+v],[sx,sy+v-u],[sx-h,sy+v/2-u]],'#b88a2a');poly([[sx,sy+v],[sx+h,sy+v/2],[sx+h,sy+v/2-u],[sx,sy+v-u]],'#d9a93a');poly([[sx,sy-u],[sx+h,sy+v/2-u],[sx,sy+v-u],[sx-h,sy+v/2-u]],'#ffd166')}}
 if(!E)return;for(const e of E){const[sx,sy]=iso(e.x,e.y),r=tw*(e.b?.3:.14),cy=sy+th/2-(e.k==='a'?tw*.3:0);
  ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(sx,sy+th/2,r,r/2,0,0,7);ctx.fill();
  ctx.fillStyle=e.b?'#9b5de5':e.k==='a'?'#ffd166':e.k==='s'?'#4dabf7':'#ff6b6b';ctx.beginPath();ctx.arc(sx,cy-r,r,0,7);ctx.fill();
  ctx.fillStyle='#000a';ctx.fillRect(sx-r,cy-r*2.6,r*2,3);ctx.fillStyle='#7bd88f';ctx.fillRect(sx-r,cy-r*2.6,r*2*Math.max(0,e.hp/e.mh),3)}
 for(const f of FX){if(f.k==='l'){const a=iso(f.x,f.y),b=iso(f.x2,f.y2);ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(a[0],a[1]+th/2-tw*.2);ctx.lineTo(b[0],b[1]+th/2);ctx.stroke()}
  else{const a=iso(f.x,f.y);ctx.fillStyle='rgba(255,160,60,'+f.t*1.8+')';ctx.beginPath();ctx.ellipse(a[0],a[1]+th/2,1.3*tw*(1.2-f.t),1.3*th*(1.2-f.t),0,0,7);ctx.fill()}}}
function bar(l,v,th_,col){const c=col||(th_?(v>th_?'#ef5350':v>th_*.75?'#ffb74d':'#66bb6a'):(v<35?'#ef5350':v<60?'#ffb74d':'#66bb6a'));return'<div class="bar"><span>'+l+'</span><div><i style="width:'+Math.min(100,v)+'%;background:'+c+'"></i>'+(th_?'<u style="left:'+th_+'%"></u>':'')+'</div></div>'}
function ui(){const ph=wave<=10?'Xây dựng':wave<=30?'Địch xuất hiện':'Thủ thành';
 $('hud').innerHTML='<div class="c">Đợt<b>'+wave+'/45</b>'+ph+'</div><div class="c">Lõi<b>'+Math.max(0,Math.round(core))+'</b>máu</div><div class="c">Đồng<b>'+Math.floor(cu)+'</b>+đạn đa năng</div><div class="c">Chì<b>'+Math.floor(pb)+'</b>+đạn nặng</div>';
 $('tr').innerHTML=TR.map(r=>'<div class="t"><h3 style="color:'+r.c+'">'+r.n+'</h3><small>Dân '+Math.floor(r.pop)+'/'+r.k*6+'</small>'+(r.k?bar('Hạnh phúc',r.h)+bar('Việc làm',work*100)+bar('Ồn',r.no,r.tN)+bar('Ô nhiễm',r.po,r.tP):'<br><small>Chưa có khu sinh sống</small>')+'</div>').join('');
 const al=[];TR.forEach(r=>{if(!r.k||r.pop<1)return;if(r.no>r.tN)al.push('🚶 '+r.n+' đang bỏ đi vì tiếng ồn quá cao');if(r.po>r.tP)al.push('☠️ '+r.n+' đang chết dần vì ô nhiễm');if(r.h<30)al.push('😞 '+r.n+' quá bất mãn, dân đang bỏ đi dần')});$('al').innerHTML=al.map(a=>'<div>'+a+'</div>').join('');
 $('msg').textContent=msg}
let last=performance.now(),ut=0;
function frame(n){let dt=Math.min((n-last)/1000,.1);last=n;let rem=dt*spd;while(rem>0){step(Math.min(.05,rem));rem-=.05}draw();ut+=dt;if(ut>.25){ut=0;if(G)ui()}requestAnimationFrame(frame)}
init();requestAnimationFrame(frame);
</script></body></html>
